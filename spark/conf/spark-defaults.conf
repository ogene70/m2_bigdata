# Spark SQL uses the Nessie REST catalog (Iceberg) — no Hadoop,
# no YARN, no HDFS: standalone cluster + MinIO via the AWS SDK.
spark.master spark://spark-master:7077

spark.sql.extensions org.apache.iceberg.spark.extensions.IcebergSparkSessionExtensions
spark.sql.defaultCatalog iceberg

spark.sql.catalog.iceberg org.apache.iceberg.spark.SparkCatalog
spark.sql.catalog.iceberg.type rest
spark.sql.catalog.iceberg.uri http://nessie:19120/iceberg/
spark.sql.catalog.iceberg.warehouse warehouse

spark.sql.catalog.iceberg.s3.endpoint http://s3:9000
spark.sql.catalog.iceberg.s3.access-key-id root
spark.sql.catalog.iceberg.s3.secret-access-key root-134
spark.sql.catalog.iceberg.s3.region us-east-1
spark.sql.catalog.iceberg.s3.path-style-access true

# Hadoop S3A filesystem (parquet staging reads from MinIO)
spark.hadoop.fs.s3a.endpoint http://s3:9000
spark.hadoop.fs.s3a.access.key root
spark.hadoop.fs.s3a.secret.key root-134
spark.hadoop.fs.s3a.region us-east-1
spark.hadoop.fs.s3a.path.style.access true
spark.hadoop.fs.s3a.connection.ssl.enabled false
spark.hadoop.fs.s3a.impl org.apache.hadoop.fs.s3a.S3AFileSystem

# Spark Connect (grpc://spark-connect:15002)
spark.connect.grpc.binding.port 15002
spark.ui.prometheus.enabled false

spark.sql.streaming.fileSource.list.as-recursive true
spark.sql.streaming.fileSource.maxFileAgeMs 1577847600000