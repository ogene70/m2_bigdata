<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>Document</title>
  <meta name="description" content="Description">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <link rel="stylesheet" href="//cdn.jsdelivr.net/npm/docsify@5/dist/themes/core.min.css">
  <link rel="stylesheet" href="//cdn.jsdelivr.net/npm/docsify@5/dist/themes/addons/vue.min.css">
</head>
<body>
  <div id="app"></div>
  <script>
    let num = 0;
    window.$docsify = {
      name: '',
      repo: '',
      loadSidebar: true,
      markdown: {
        renderer: {
          code: function ({ text, lang }) {
            if (lang === 'mermaid') {
              return '<div class="mermaid">' +
                mermaid.render('mermaid-svg-' + num++, text) + '</div>';
            }
            return this.origin.code.apply(this, arguments);
          }
        }
      }
    };
  </script>
  <!-- Docsify resource -->
  <script src="//cdn.jsdelivr.net/npm/docsify@5"></script>
  <!-- Mermaid resource -->
  <script src="//cdn.jsdelivr.net/npm/mermaid@9.3.0/dist/mermaid.min.js"></script>
  <script>
    mermaid.initialize({ startOnLoad: false, securityLevel: 'loose' });
  </script>
</body>
</html>
