server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    gzip off;

    location / {
        try_files $uri $uri/ /index.html;
    }

    # Flux SSE : pas de buffering, connexion persistante.
    location /events {
        proxy_pass http://topic-push:8090/events;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 1h;
        proxy_send_timeout 1h;
        add_header X-Accel-Buffering no;
    }

    location /sessions {
        proxy_pass http://topic-push:8090/sessions;
        proxy_set_header Host $host;
        proxy_read_timeout 30s;
    }

    location /healthz {
        proxy_pass http://topic-push:8090/healthz;
        proxy_set_header Host $host;
    }
}
